# Maps OneProvider default model IDs to their Artificial Analysis dataset entries.
# Each variant's aa_name must match exactly the "name" field in the AA API response.
# effort: short label used in the README benchmark table (sorted low → max).
# When AA adds data for a new model, add its variants here and run: python scripts/plot.py --refresh

models:
  - id: claude-fable-5-1
    label: "Fable 5.1"
    color: "#c07b2a"
    variants:
      - aa_name: "Claude Fable 5.1 (Adaptive Reasoning, Low Effort, Default Fallback)"
        effort: "low"
      - aa_name: "Claude Fable 5.1 (Adaptive Reasoning, Medium Effort, Default Fallback)"
        effort: "medium"
      - aa_name: "Claude Fable 5.1 (Adaptive Reasoning, High Effort, Default Fallback)"
        effort: "high"
      - aa_name: "Claude Fable 5.1 (Adaptive Reasoning, Xhigh Effort, Default Fallback)"
        effort: "xhigh"
      - aa_name: "Claude Fable 5.1 (Adaptive Reasoning, Max Effort, Default Fallback)"
        effort: "max"

